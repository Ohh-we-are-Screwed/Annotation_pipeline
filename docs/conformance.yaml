      MISMATCH between the two paths to reconcile: the text path and today's
      default box path resolve the identical processor geometry, so C29 takes
      the spike's branch (a) for BOTH -- "internal square resize with an exact
      inverse mapping back to 1280x720 is compliant; the rule-3 prohibition
      governs PERSISTED/MEASURED geometry" -- and no letterboxing work item
      follows. Status stays PLAUSIBLE and NOT CONFORMS deliberately: the
      geometry facts are measured, but whether they SATISFY rule 3 rests on a
      reading that is FLAGGED FOR RATIFICATION (C29 gate 1). If the operator
      rejects reading (a) this row becomes VIOLATES and the remedy touches the
      DEFAULT provider, not only sam3_text. Recorded consequence either way:
      720 -> 1008 -> 288 decides the mask boundary at ~2.5 px of native
      vertical resolution, which costs wide shallow bands more than compact
      objects.
