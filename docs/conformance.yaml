# DhakaScenes Pilot — conformance ledger (Activity A, BUILD_PROMPT.md §4)
#
# One row per checkable assertion of docs/pilot_plan.md rev 2 (the bible).
# Validated and rendered by scripts/check_conformance.py.
#
# Row schema (BUILD_PROMPT.md §4.1):
#   id       <plan-section>-r<ordinal> — stable, never reused
#   source   plan section / audit finding the claim comes from
#   claim    the assertion, stated so it could be false
#   kind     contract|behaviour|artifact|value|test|decision|claim-hygiene|structure
#   status   CONFORMS|PLAUSIBLE|VIOLATES|ABSENT|UNVERIFIABLE|N/A
#   evidence {class: TEST|MEASUREMENT|CODE-SITE|ARTIFACT|HUMAN, ref: ...}
#   closes   audit finding IDs this row bears on
#   phase    plan phase that owns the claim
#   note     caveats, measured values, cross-references
#
# THE LOAD-BEARING RULE (BUILD_PROMPT.md §4.2): CONFORMS requires evidence of
# class TEST or MEASUREMENT. A CODE-SITE supports at most PLAUSIBLE. Reading
# code is not verification.
#
# Evidence shorthand:
#   EV = docs/evidence/substrate_remeasure.json (produced by
#        scripts/collect_evidence.py, re-runnable; MEASUREMENT class)
#   file.py:N = code-site (PLAUSIBLE at best)

