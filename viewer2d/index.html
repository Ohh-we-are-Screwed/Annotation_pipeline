<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D results — read-only viewer</title>
<style>
  :root { color-scheme: dark; --bg:#111318; --panel:#191c22; --line:#2a2f39; --fg:#d8dbe0; --dim:#8b93a1; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:13px/1.45 system-ui, sans-serif; overflow:hidden; }
  #bar { display:flex; align-items:center; gap:12px; padding:8px 12px; background:var(--panel);
         border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #bar input[type=range] { flex:1; min-width:140px; }
  #main { flex:1; display:flex; min-height:0; }
  #grid { flex:1; min-width:0; display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:1fr 1fr;
          gap:6px; padding:6px; overflow:auto; }
  figure { margin:0; min-width:0; display:flex; flex-direction:column; }
  figure canvas { width:100%; height:auto; background:#000; border:1px solid var(--line); display:block; }
  figcaption { color:var(--dim); padding-bottom:3px; display:flex; gap:8px; }
  #side { width:350px; border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:10px 12px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:14px 0 5px; }
  h2:first-child { margin-top:0; }
  .mono, code { font-family:ui-monospace, monospace; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:2px 4px; border-bottom:1px solid var(--line); vertical-align:top; text-align:left; }
  th { color:var(--dim); font-weight:normal; }
  tr.box { cursor:pointer; }
  tr.box:hover { background:#20242c; }
  tr.box.sel { background:#3a4152; }
  .sw { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:baseline; }
  .dim { color:var(--dim); }
  #legend { display:flex; gap:10px; flex-wrap:wrap; }
  #legend span { white-space:nowrap; }
</style>
</head>
<body>
<div id="bar">
  <strong id="scene">…</strong><span class="dim mono" id="chunk"></span>
  <input type="range" id="slider" min="0" max="0" value="0">
  <span class="mono" id="pos">0/0</span>
  <label><input type="checkbox" id="cbMask" checked> masks</label>
  <label><input type="checkbox" id="cbA" checked> arm A</label>
  <label><input type="checkbox" id="cbB" checked> arm B</label>
  <label><input type="checkbox" id="cbTag" checked> 3D outcome tags</label>
  <label><input type="checkbox" id="cbWire" checked> projected 3D boxes</label>
  <span class="dim">← → keyframe</span>
</div>
<div id="main">
  <div id="grid"></div>
  <div id="side"></div>
</div>

<script type="module">
// Palette, status colours and the painter are viewer2d/draw.js — shared with compare.html
// so the two pages cannot disagree about what a box looks like.
import { classColor, statusColor, paintBoxes, legendHTML } from './draw.js';
const key = (ch, b) => ch + ':' + b.i;

let index = null, kf = null, selected = null;
const view = { mask: true, arm_a: true, arm_b: true, tag: true, wire: true };
const images = {};
const shown = (b) => (b.arm === 'arm_b' ? view.arm_b : view.arm_a);

// --- painting -------------------------------------------------------------
function paint(ch) {
  const cv = document.getElementById('cv_' + ch);
  if (cv) paintBoxes(cv, images[ch], kf && kf.cameras[ch], { view, isSelected: (b) => key(ch, b) === selected });
}

const repaint = () => index.channels.forEach(paint);

// --- side panel -----------------------------------------------------------
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const hist = (counts, color) => Object.entries(counts).sort((a, b) => b[1] - a[1])
  .map(([k, n]) => `<tr><td>${color ? `<span class="sw" style="background:${color(k)}"></span>` : ''}${esc(k)}</td>
                        <td class="mono">${n}</td></tr>`).join('') || '<tr><td class="dim">none</td></tr>';

function buildPanel() {
  const status = {}, classes = {}, per = [], rows = [];
  for (const ch of index.channels) {
    const cam = kf.cameras[ch];
    if (!cam) { per.push(`<tr><td>${ch}</td><td class="dim" colspan="2">absent</td></tr>`); continue; }
    let a = 0, b = 0, m = 0, fit = 0, nonfit = 0;
    for (const box of cam.boxes) {
      box.arm === 'arm_b' ? b++ : a++;
      if (box.poly) m++;
      if (box.status) { status[box.status] = (status[box.status] || 0) + 1; box.status === 'fit' ? fit++ : nonfit++; }
      classes[box.cls] = (classes[box.cls] || 0) + 1;
      if (!shown(box)) continue;
      const sc = statusColor(box.status);
      rows.push(`<tr class="box ${key(ch, box) === selected ? 'sel' : ''}" data-k="${key(ch, box)}">
        <td><span class="sw" style="background:${classColor(box.cls)}"></span>${esc(box.cls)}
            <div class="dim mono">${ch} #${box.i} · ${box.arm === 'arm_b' ? 'B' : 'A'} · ${box.score.toFixed(2)}</div></td>
        <td class="mono dim">${sc ? `<span class="sw" style="background:${sc}"></span>${esc(box.status)}` : '·'}
            <div>${box.depth_m != null ? 'd ' + box.depth_m.toFixed(1) + ' m' : ''}${box.track_id != null ? ' · t' + box.track_id : ''}</div></td></tr>`);
    }
    per.push(`<tr><td>${ch}</td><td class="mono">${a}A ${b}B</td>
                  <td class="mono dim">${m} msk · ${fit}/${fit + nonfit} fit</td></tr>`);
  }
  document.getElementById('side').innerHTML = `
    <h2>keyframe</h2><div class="mono">${esc(kf.token)}</div><div class="dim mono">t_ns ${kf.t_ns}</div>
    <h2>per camera</h2><table><tr><th>channel</th><th>props</th><th>masks / 3D</th></tr>${per.join('')}</table>
    <h2>3D outcome</h2><table>${hist(status, statusColor)}</table>
    <h2>classes</h2><table>${hist(classes, classColor)}</table>
    <h2>boxes (${rows.length})</h2><table>${rows.join('') || '<tr><td class="dim">none</td></tr>'}</table>`;
  for (const tr of document.querySelectorAll('tr.box')) tr.onclick = () => select(tr.dataset.k);
}

function select(k) {
  selected = selected === k ? null : k;
  buildPanel(); repaint();
}

function legend() {
  document.getElementById('legend').innerHTML = legendHTML();
}

// --- keyframe loading -----------------------------------------------------
async function show(i) {
  const n = index.keyframes.length;
  i = Math.max(0, Math.min(n - 1, i));
  kf = await (await fetch(`kf/${String(index.keyframes[i].index).padStart(5, '0')}.json`)).json();
  selected = null;
  document.getElementById('slider').value = i;
  document.getElementById('pos').textContent = `${i + 1}/${n}`;
  buildPanel();
  for (const ch of index.channels) {
    const cam = kf.cameras[ch];
    if (!cam) { paint(ch); continue; }
    images[ch].src = cam.image;
    if (images[ch].complete) paint(ch);
  }
}

index = await (await fetch('index.json')).json();
document.getElementById('scene').textContent = index.scene;
document.getElementById('chunk').textContent = 'chunk ' + index.chunk;
document.getElementById('grid').innerHTML = index.channels.map((ch) => {
  // The export's pose for this channel was pitch-corrected before the wireframes were
  // projected (configs/stereo_box.yaml); say so, or they look right for a hidden reason.
  const corr = (index.camera_pose_corrections || {})[ch];
  return `<figure><figcaption>${ch}${corr ? ` <span class="dim">pose pitch-corrected ${corr.deg.toFixed(2)}°</span>` : ''}</figcaption>
          <canvas id="cv_${ch}"></canvas></figure>`;
}).join('');
for (const ch of index.channels) { images[ch] = new Image(); images[ch].onload = () => paint(ch); }
document.getElementById('bar').insertAdjacentHTML('beforeend', '<div id="legend" class="dim" style="flex-basis:100%"></div>');
legend();
const slider = document.getElementById('slider');
slider.max = Math.max(0, index.keyframes.length - 1);
slider.oninput = () => show(+slider.value);
for (const [id, k] of [['cbMask', 'mask'], ['cbA', 'arm_a'], ['cbB', 'arm_b'], ['cbTag', 'tag'], ['cbWire', 'wire']]) {
  const el = document.getElementById(id);
  el.checked = view[k];
  el.onchange = () => { view[k] = el.checked; buildPanel(); repaint(); };
}
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); show(+slider.value - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); show(+slider.value + 1); }
});
await show(0);
</script>
</body>
</html>
