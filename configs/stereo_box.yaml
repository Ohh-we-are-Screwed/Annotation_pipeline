# Approach A tunables (spec §3.4, §4.2). Values with provenance; the evidence doc
# named below is the measurement behind the two calibration-derived ones:
#   docs/evidence/2026-09-12-stereo-vs-lidar-chunk_0010.md  (+ .json, the source of
#   every number quoted here), scripts/spike_stereo_vs_lidar.py on
#   dhaka_20260911_141259_chunk_0010, 120 of 668 keyframes (stride 5).

# ASSUMED, not measured: "spec §3.4 default — ASSUMED, not measured; the plan's
# agreement rule is degenerate under the 0.6 m pairing radius". Controller ruling
# 2026-09-12, after the spike reported 40 m. The spike's §3.4 cap rule
# is degenerate on this data: d_range is |p_zed| - |p_lidar| for a LiDAR reference
# chosen within 0.6 m in 3D, so |d_range| <= 0.6 by construction and the rule's
# "median <= 0.5 m and MAD <= 1.0 m" can never fail. The only condition left able
# to bind is the >= 200-pair floor, and with 120 keyframes every 1 m bin out to
# 40 m clears it, so the rule returned 40 m (cap_binding_condition:
# saturated_at_bin_loop_limit) — an artefact of the method, not a measured range
# of agreement, and not something to widen a ZED trust radius on.
# Uncensored, frac_paired (the share of a ring's points finding any LiDAR
# reference within 0.6 m) falls below 0.50 at 10-11 m for ring 100 and at 7-8 m
# for ring 101, the latter because of the ring 101 defect recorded below.
# Remeasure after the ZED 101 export calibration is fixed.
# One number, two readers: KEEP EQUAL to eval_region.STEREO_RANGE_CAP_DEFAULT_M.
stereo_range_cap_m: 25.0

# MEASURED — and EMPTY because the rigidity test FAILED. Ring 101's floor is
# range-dependent (see stereo_z_correction_m below), which is a ROTATION, so the
# spike measured the pitch that flattens it and verified it in memory against the
# whole sampled scene. Pivot = the camera's own optical centre in the ego frame,
# (x 0.81253, z -0.73305) m, from the export's own
#   <dataroot>/v1.0-dhaka-fixed2/calibrated_sensor.json, channel CAM_FRONT
#   (ZED 2i serial 35084019 = ring 101),
# corroborated by /home/saif/dhaka-export-pipeline-20260911/configs/rig/
# legacy_zed_extrinsic.json, which carries the identical translation and names that
# serial. NOT derived from the floor line: camera height is unobservable from ground
# points alone, and a rotation about the wrong pivot flattens the floor at the wrong
# height while looking correct.
# WHAT THE SPIKE FOUND (pitch_report.101 in the evidence JSON):
#   a single angle of -9.0974 deg DOES pass the slope and floor test over 3-25 m —
#     corrected floor slope -0.00994 m/m (limit 0.01), every bin's p5 floor >= -0.146 m
#     (limit -0.45), and the share of ring-101 points below the ground band falls
#     0.446 -> 0.005. So the defect IS overwhelmingly a pitch, and the sign is
#     verified numerically (the flipped +6.8424 deg makes the floor worse, -0.280 m/m).
#   BUT the per-block spread test FAILS, on BOTH windows (12 blocks of 10 keyframes):
#     over 3-25 m          p10 -0.2054 / p50 -0.1469 / p90 -0.1288 m/m, spread 0.0766
#     over 3-12 m          p10 -0.2813 / p50 -0.2457 / p90 -0.2351 m/m, spread 0.0462
#     against the 0.020 m/m limit. 3-12 m is the range the Stage 1 ground plane was
#     actually FITTED over (ground_fit_range_m), so it is the window where the
#     reference is measured rather than extrapolated — it is the deciding one, and it
#     still fails. Controller rule 2026-09-12 round 2, second branch: keep {}.
#   READ THIS BEFORE TRUSTING THAT REJECTION. The same test run on the LiDAR's own
#     floor against the LiDAR's own plane, same blocks, same 3-12 m window, gives
#     p10 -0.0094 / p50 +0.0157 / p90 +0.0647, spread 0.0741 m/m — WIDER than ring
#     101's 0.0462. The LiDAR is rigid with respect to itself by construction, so on
#     10-keyframe blocks this floor-slope estimator is noisier than the 0.020 bar it
#     is judged against, and ring 101 is in fact MORE consistent than the reference.
#     The rejection is therefore a decision by rule, not a demonstration that the
#     camera is non-rigid. Independent of that, the angle is window-dependent
#     (-8.4 deg over 3-25 m, -13.8 deg over 3-12 m), which does argue the defect is
#     not a PURE rotation. See the report's concerns.
# CONSEQUENCE FOR THIS RUN: the front frustum (ring 101) is DROPPED downstream, not
# corrected. Task 8 reads this file: ring 101 contributes no box.
# Approach A is judged on ring 100. The real fix is upstream — a re-export with
# corrected front-ZED extrinsics; the rig config this export was built from still
# says `calibrated: false` / "INITIAL GUESS -- replace with scripts/calibrate.sh"
# for this camera. That re-export is out of scope for this branch.
# If the controller relaxes the rigidity bar (or re-measures the spread with an
# estimator quieter than its own 0.020 m/m bar), the flag is exactly:
#   # Stage 1: --stereo-pitch-correction 101:-9.0974:0.81253:-0.73305
# NOT endorsed by this task's acceptance test as it stands. Applied by Stage 1 ONLY; the box
# stage never re-applies it.
stereo_pitch_correction: {}

# MEASURED — and deliberately EMPTY. Neither ring qualifies for a constant z
# correction under the §3.4 rule (|offset| > 0.2 m AND |slope| < 0.01 m/m):
#   ring 100 (rear ZED)  ALIGNED. Its floor (p10 of z minus the keyframe's own
#     per-sector LiDAR ground plane) sits at -0.322 m over 3-15 m, which IS
#     Stage 1's 0.30 m ground band edge — the ring's road returns coincide with
#     the LiDAR road and were deleted by the ground filter. Its deepest bin over
#     1-40 m is only 0.107 m past that edge. Nothing to correct.
#   ring 101 (front ZED) MISALIGNED, and RANGE-DEPENDENT — see
#     stereo_pitch_correction above, which is where that defect is handled (or, as
#     measured, declined). A constant would
#     under-correct at every range but one. Floor median -1.313 m over 3-15 m
#     (slope -0.2137 m/m, -12.06 deg); over the full 3-40 m span it walks from
#     +0.41 m in the first bin to -4.26 m in the last, slope -0.1200 m/m
#     (-6.84 deg), deepest bin 4.046 m past the band edge. 69-72% of ring 101
#     lies below the fitted road in the 7-10 m bins. Both rings come through the
#     SAME global->ego transform (ingest.stereo_block_to_ego, global_identity),
#     so this is a per-camera pitch/rotation defect in the export's front-ZED
#     extrinsics, NOT a constant vertical offset and NOT a transform bug.
# FIX IT UPSTREAM (re-export the front ZED's extrinsics); z_correction_m cannot
# express a rotation — that is what stereo_pitch_correction exists for. Until then
# the front ZED's points are untrustworthy in z beyond ~6 m and Approach A should
# be judged on ring 100.
# Applied by Stage 1 ONLY (--stereo-z-correction RING:METRES, repeatable); the
# box stage never re-applies it. Sign, verified against stereo_block_to_ego
# (which does `xyz[ring, 2] += dz`): the value is MINUS the measured offset, so
# it cancels rather than doubles it.
stereo_z_correction_m: {}

k_mad: 3.0                        # spec §4.2 step 1
mad_floor_m: 0.10                 # spec §4.2 step 1
min_stereo_pts: 20                # spec §4.2 step 1
lidar_refine_min_pts: 5           # spec §4.2 step 2
eig_ratio_isotropic: 1.5          # spec §4.2 step 6
percentile_lo: 5                  # spec §4.2 step 3
percentile_hi: 95
near_face_percentile: 20          # spec §4.2 step 7: the near face is p20 of the trimmed depths
prior_clamp_sigma: 2.0            # spec §4.2 step 5
min_samples: 5                    # recorded for Stage 7's reconstruct_cluster_points; A does not cluster
