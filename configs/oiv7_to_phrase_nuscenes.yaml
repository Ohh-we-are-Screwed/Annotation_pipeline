# DhakaScenes Pilot — Open Images V7 class -> prompt phrase (Stage 3, ultralytics provider)
#
# The SECOND closed-vocabulary source vocabulary this pipeline supports. Same
# contract as configs/coco_to_phrase_nuscenes.yaml, same block names
# (`coco_to_phrase` / `excluded_coco_classes` — the loader's key names, which
# are the ROLE's names, not a claim that these are COCO classes): the bridge
# from a detector's own class ids into the phrase class space that Stage 6's
# epsilon, Stage 8's prior and the CVAT category id all key on.
#
# Checkpoint: yolov8x-oiv7.pt (ultralytics, Open Images V7, 601 classes).
# The names below were read from that checkpoint's OWN `model.names`, in its own
# class-id order, and `ClassMap.assert_covers` re-checks the coverage against
# the loaded weights at every start-up.
#
# WHAT 601 CLASSES BUY OVER COCO-80, measured rather than assumed
# ---------------------------------------------------------------
# NOT the four unreachable phrases. Open Images V7 has **no traffic cone, no
# road barrier, no trailer and no construction vehicle** — the nearest names in
# its vocabulary are `Traffic sign`, `Barrel`, `Nail (Construction)` and
# `Mixer`, none of which is the object. So the same four phrases stay
# UNREACHABLE under this checkpoint, and they are still 21.3% of this
# substrate's ground truth:
#
#   "a road barrier"        12.5% of GT
#   "a traffic cone"         7.4% of GT
#   "a construction vehicle" 1.1% of GT
#   "a trailer"              0.3% of GT
#
# What it does buy is a WIDER SOURCE SET for the six phrases that are reachable
# — 13 source classes where COCO had 6:
#
#   "a pedestrian"   Person, Man, Woman, Boy, Girl      (COCO: person)
#   "a car"          Car, Van, Taxi, Limousine          (COCO: car)
#   "a bicycle"      Bicycle                            (COCO: bicycle)
#   "a motorcycle"   Motorcycle                         (COCO: motorcycle)
#   "a bus"          Bus                                (COCO: bus)
#   "a truck"        Truck                              (COCO: truck)
#
# `Van`, `Taxi` and `Limousine` map to "a car" because nuScenes' own
# `vehicle.car` definition covers them ("vans, SUVs, ... primarily for personal
# use"). `Man`/`Woman`/`Boy`/`Girl` collapse into one phrase for the same reason
# the five nuScenes pedestrian subtypes do (C21).
#
# THE SUPERCLASS DECISION, recorded because it costs recall
# ---------------------------------------------------------
# Open Images is HIERARCHICAL: `Vehicle` and `Land vehicle` are parents of Car,
# Truck and Bus, and the detector emits them as their own boxes. They are
# EXCLUDED, not mapped: a box labelled `Vehicle` does not say which phrase it
# is, and mapping it to "a car" would relabel every truck and bus under it. That
# is a real recall cost on this checkpoint, taken deliberately, because the
# alternative is a wrong label that every downstream stage would key on.
#
# provenance: authored 2026-08-14, human-directed — the second arm of the
#             proposal_2d comparison (yolo11x COCO-80 vs yolov8x OIV7-601).
#             Generated from the checkpoint's own model.names; the six phrase
#             groupings are the nuScenes detection benchmark's, not ours.

spec: dhakascenes-pilot/oiv7_to_phrase_nuscenes/v1
version: 1
n_source_classes: 601
n_mapped: 13

# --- the class space this detector can actually reach -----------------------
coco_to_phrase:
  "Bicycle":      "a bicycle"
  "Boy":          "a pedestrian"
  "Bus":          "a bus"
  "Car":          "a car"
  "Girl":         "a pedestrian"
  "Limousine":    "a car"
  "Man":          "a pedestrian"
  "Motorcycle":   "a motorcycle"
  "Person":       "a pedestrian"
  "Taxi":         "a car"
  "Truck":        "a truck"
  "Van":          "a car"
  "Woman":        "a pedestrian"

# --- deliberately OUT of the class space ------------------------------------
