# DhakaScenes release export — Zami phrase/class string -> dbench class name.
#
# Consumed by scripts/export_release.py. Target names are a SUBSET of
# /home/mt/dataset_benchmark/configs/benchmark_v1.0.yaml (`taxonomy.groups`),
# spelled identically so a name that appears here means the same class there;
# the exporter refuses to run if `map` values stray outside `classes`.
#
# `classes` is NOT dbench's full 18 — see the trim note above `classes` for the
# 7 this pipeline has no inference path for and what that costs.
#
# Keys are whatever `AnnotationRecord.category` holds in prelabels.jsonl:
#   - the pilot prompt PHRASES from configs/taxonomy_pilot_nuscenes.yaml
#     (nuScenes-mini stand-in; those records are NOT Dhaka results), and
#   - the Dhaka class spellings from docs/comprehensive.md §6.1 (dash form and
#     the likely prompt phrases), for when the Dhaka taxonomy config exists.
# Matching is exact after lowercasing + whitespace collapse. Anything not in
# `map` is an error that lists the offending strings; anything in `unresolved`
# is an error naming the decision that is still owed. Nothing is guessed.
#
# provenance: authored 2026-08-23 (audit items Z-11 / dbench B1, B2).

spec: dhakascenes/release_category_map/v1
version: 1

# TRIMMED 2026-09-10 from dbench's 18 to the 11 this pipeline can actually
# produce. The dropped 7 had no inference path at all: arm A prompts from
# taxonomy_pilot_dhaka.yaml's 12 phrases (none name them) and arm B ships only
# `rickshaw` + `cng` of its 13 RSUD20K classes — `covered van`, `micro bus` and
# `human hauler` ARE baked into that checkpoint's model.names but were never
# trained (train-time classes=[0,1,3,6,7]) and are excluded at the NMS ship
# filter. Declaring them made category.json advertise coverage that could not
# exist; five delivered chunks carried all 18 with 10 of them at zero boxes.
#
# DROPPED: covered_van, microbus, battery_rickshaw, tempo, human_hauler,
#          pushcart, animal
#
# COST, recorded so it is not lost: battery_rickshaw is one of dbench's three
# `headline_classes` (benchmark_v1.0.yaml §1) — "the scientific contribution
# ... always reported individually, never folded into a macro-average". With
# it gone and `a rickshaw` -> cycle_rickshaw below, battery rickshaws are now
# folded into cycle_rickshaw with no class of their own. Recovering it needs an
# arm B fine-tune that separates the two rickshaw types, not a config change.
#
# Still declared but never yet observed: traffic_cone, barrier and
# construction_element are actively prompted (arm A) and produced 0 boxes
# across ~110k. They stay because the phrases are live — dropping them would
# make the exporter refuse any chunk in which one finally fires.
classes:
  - car
  - bus
  - truck
  - cng_autorickshaw
  - cycle_rickshaw
  - bicycle
  - motorcycle
  - pedestrian
  - traffic_cone
  - barrier
  - construction_element

map:
  # --- pilot phrases (nuScenes-mini substrate) -------------------------------
  "a car": car
  "a pedestrian": pedestrian
  "a road barrier": barrier
  "a traffic cone": traffic_cone
  "a truck": truck
  "a motorcycle": motorcycle
  "a bus": bus
  "a bicycle": bicycle
  "a construction vehicle": construction_element   # closest dbench static class; pilot-only
  "a trailer": truck                                 # nuScenes trailer has no Dhaka class; pilot-only

  # --- Dhaka class spellings (comprehensive.md §6.1) ---------------------------
  "car": car
  "bus": bus
  "truck": truck
  "cng-auto-rickshaw": cng_autorickshaw
  "cng auto-rickshaw": cng_autorickshaw
  "a cng auto-rickshaw": cng_autorickshaw
  "cycle-rickshaw": cycle_rickshaw
  "a cycle rickshaw": cycle_rickshaw
  # arm B phrases (taxonomy_pilot_dhaka.yaml, 2026-08-27). RSUD20K `rickshaw`
  # does not separate cycle from battery rickshaws; mapping to cycle_rickshaw
  # follows the paper's usage — the conflation is recorded here on purpose.
  "a rickshaw": cycle_rickshaw
  "an auto rickshaw": cng_autorickshaw
  "bicycle": bicycle
  "motorcycle": motorcycle
  "pedestrian": pedestrian
  "traffic-cone": traffic_cone
  "barrier": barrier
  "construction": construction_element

# Strings that occur upstream but whose mapping is a taxonomy decision nobody
# has made. The exporter refuses them with this reason rather than guessing.
unresolved:
  "static-obstacle": >-
    comprehensive.md §6.1 folds traffic-cone/barrier/construction into one
    v1.0 class; dbench has three. Cannot be split post-hoc (audit B1) — either
    annotate the three separately or add a single static class to dbench.
